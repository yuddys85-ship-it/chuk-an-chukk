<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chuk an Chukk</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6b2cff">
  <link rel="icon" href="assets/icon-192.png">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Style -->
  <link rel="stylesheet" href="style.css">

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>

<body>

<div id="notification" class="notification"></div>

<div class="container fade-in">

    <div class="logo">
        <img src="assets/logo.png" alt="Chuk an Chukk">
        <h1>Chuk an Chukk</h1>
        <p>Live Social App for Pi Community</p>
    </div>

    <!-- LOGIN PAGE -->

    <div id="loginPage">

        <button class="btn-purple" onclick="login()">
            Login with Pi
        </button>

    </div>

    <!-- APP PAGE -->

    <div id="appPage" style="display:none;">

        <div class="card glass">

            <h2 id="username">
                Welcome
            </h2>

        </div>

        <div class="card">

            <h3>Wallet</h3>

            <div class="wallet-grid">

                <div class="wallet-box">

                    <p>CHUK</p>

                    <h2 id="chukBalance">0</h2>

                </div>

                <div class="wallet-box">

                    <p>PI</p>

                    <h2 id="piBalance">0</h2>

                </div>

                <div class="wallet-box">

                    <p>Locked</p>

                    <h2 id="lockedBalance">0</h2>

                </div>

                <div class="wallet-box">

                    <p>Total</p>

                    <h2 id="totalBalance">0</h2>

                </div>

            </div>

        </div>

        <div class="card">

            <h3>Exchange CHUK</h3>

            <input
                id="exchangeInput"
                type="number"
                placeholder="Amount">

            <button
                class="btn-green"
                onclick="exchangeChuk()">

                Exchange

            </button>

        </div>

        <div class="card">

            <button
                class="btn-purple"
                onclick="earnChuk()">

                Earn 1000 CHUK

            </button>

            <button
                class="btn-green"
                onclick="payWithPi()">

                Buy CHUK With Pi

            </button>

            <button
                id="installBtn"
                class="btn-purple"
                style="display:none;">

                Install App

            </button>

            <button
                class="btn-red"
                onclick="logout()">

                Logout

            </button>

        </div>

        <div class="card">

            <h3>History</h3>

            <div id="history"></div>

        </div>

    </div>

    <div id="loading">
        Loading...
    </div>

    <div class="footer">

        © 2026 Chuk an Chukk

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
