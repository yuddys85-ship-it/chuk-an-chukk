<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chuk an Chukk</title>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (typeof Pi !== "undefined") {
        Pi.init({
          version: "2.0",
          sandbox: true
        });
      } else {
        alert("Buka di Pi Browser!");
      }
    });

    async function login() {
      try {
        if (typeof Pi === "undefined") {
          alert("Harus di Pi Browser");
          return;
        }

        const auth = await Pi.authenticate(["username"]);
        alert("Welcome " + auth.user.username);
      } catch (err) {
        console.error(err);
        alert("Login gagal");
      }
    }
  </script>

  <style>
    body {
      font-family: Arial;
      background: #6b2cff;
      color: white;
      text-align: center;
      padding: 50px;
    }
    button {
      padding: 12px 20px;
      border: none;
      border-radius: 6px;
      background: white;
      color: #6b2cff;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <h1>Chuk an Chukk</h1>
  <p>Live Social App for Pi Community</p>

  <button onclick="login()">Login with Pi</button>
</body>
</html>
