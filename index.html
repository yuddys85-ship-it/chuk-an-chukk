<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Chuk an Chukk</title>

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      background:#6fd6d6;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      position:relative;
    }

    /* Background Glow */
    .bg1,
    .bg2{
      position:absolute;
      border-radius:50%;
      filter:blur(80px);
      opacity:0.4;
    }

    .bg1{
      width:300px;
      height:300px;
      background:#ffd700;
      top:-80px;
      left:-80px;
    }

    .bg2{
      width:250px;
      height:250px;
      background:#ffffff;
      bottom:-80px;
      right:-80px;
    }

    .container{
      width:360px;
      background:rgba(255,255,255,0.15);
      border:1px solid rgba(255,255,255,0.2);
      backdrop-filter:blur(15px);
      border-radius:30px;
      padding:40px 30px;
      text-align:center;
      color:white;
      box-shadow:0 10px 40px rgba(0,0,0,0.2);
      z-index:2;
    }

    .logo{
      width:100px;
      height:100px;
      margin:auto;
      border-radius:50%;
      background:linear-gradient(145deg,#ffd700,#ffea70);
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:52px;
      font-weight:700;
      color:#444;
      box-shadow:0 0 25px rgba(255,215,0,0.7);
      margin-bottom:20px;
    }

    h1{
      font-size:32px;
      color:#ffd700;
      margin-bottom:10px;
      font-weight:700;
    }

    .tagline{
      font-size:14px;
      color:#ffffff;
      margin-bottom:30px;
      line-height:1.5;
    }

    .btn{
      width:100%;
      padding:15px;
      border:none;
      border-radius:15px;
      background:linear-gradient(145deg,#ffd700,#ffea70);
      color:#333;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      transition:0.3s;
      box-shadow:0 5px 15px rgba(255,215,0,0.4);
    }

    .btn:hover{
      transform:translateY(-2px);
    }

    .user-box{
      margin-top:25px;
      padding:15px;
      border-radius:15px;
      background:rgba(255,255,255,0.15);
      display:none;
    }

    .user-box h3{
      color:#ffd700;
      margin-bottom:5px;
    }

    .status{
      margin-top:20px;
      font-size:13px;
      color:#fff;
      opacity:0.8;
    }

    .footer{
      margin-top:25px;
      font-size:12px;
      opacity:0.7;
    }

    .support{
      margin-top:20px;
    }

    .support a{
      color:#ffd700;
      text-decoration:none;
      font-weight:600;
    }
  </style>
</head>

<body>

<div class="bg1"></div>
<div class="bg2"></div>

<div class="container">

  <!-- Logo -->
  <div class="logo">
    C
  </div>

  <!-- Title -->
  <h1>Chuk an Chukk</h1>

  <!-- Subtitle -->
  <div class="tagline">
    Live Social App for Pi Community
  </div>

  <!-- Login Button -->
  <button class="btn" onclick="loginPi()">
    Login with Pi
  </button>

  <!-- User Info -->
  <div class="user-box" id="userBox">
    <h3>Welcome</h3>
    <p id="username"></p>
  </div>

  <!-- Status -->
  <div class="status" id="status">
    Sandbox Mode Active
  </div>

  <!-- Support -->
  <div class="support">
    <a href="#">Support Center</a>
  </div>

  <!-- Footer -->
  <div class="footer">
    © 2026 Chuk an Chukk
  </div>

</div>

<script>

  // Initialize Pi SDK
  Pi.init({
    version: "2.0",
    sandbox: true
  });

  // Login Function
  async function loginPi(){

    try{

      document.getElementById("status").innerHTML =
      "Connecting to Pi Network...";

      const scopes = ['username','payments'];

      const authResult = await Pi.authenticate(
        scopes,
        onIncompletePaymentFound
      );

      // Show user info
      document.getElementById("userBox").style.display = "block";

      document.getElementById("username").innerHTML =
      "@" + authResult.user.username;

      document.getElementById("status").innerHTML =
      "Login Success";

      console.log(authResult);

    }catch(error){

      console.error(error);

      document.getElementById("status").innerHTML =
      "Login Failed";

      alert("Pi Login Failed");

    }

  }

  // Payment callback
  function onIncompletePaymentFound(payment){
    console.log("Incomplete Payment Found", payment);
  }

</script>

</body>
</html>
