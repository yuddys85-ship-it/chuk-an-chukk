<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chuk an Chukk</title>

  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #0b0b0f;
      color: white;
      padding: 20px;
    }

    h1, h2 {
      text-align: center;
    }

    .card {
      background: #1c1c25;
      padding: 15px;
      border-radius: 10px;
      margin: 10px 0;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-purple {
      background: #6b2cff;
      color: white;
    }

    .btn-green {
      background: #00c853;
      color: white;
    }
  </style>
</head>

<body>

<div id="loginPage">
  <h1>Chuk an Chukk</h1>
  <p>Login with Pi</p>
  <button class="btn-purple" onclick="login()">Login with Pi</button>
</div>

<div id="appPage" style="display:none;">
  <h2 id="username"></h2>

  <div class="card">
    <h3>Wallet</h3>
    <p>CHUK: <span id="chukBalance">0</span></p>
    <p>PI: <span id="piBalance">0</span></p>
  </div>

  <div class="card">
    <button class="btn-purple" onclick="earnChuk()">🎁 Earn</button>
    <button class="btn-green" onclick="payWithPi()">💸 Buy CHUK</button>
  </div>
</div>

<script>
const BASE_URL = "https://chuk-an-chukk-beckend.vercel.app/api";

let wallet = {
  chuk: 50000,
  pi: 10
};

let currentUser = null;

document.addEventListener("DOMContentLoaded", () => {
  if (typeof Pi !== "undefined") {
    Pi.init({ version: "2.0", sandbox: true });
  }

  updateUI();
});

async function login() {
  try {
    const auth = await Pi.authenticate(["username"]);
    currentUser = auth.user;

    document.getElementById("username").innerText =
      "Welcome " + currentUser.username;

    document.getElementById("loginPage").style.display = "none";
    document.getElementById("appPage").style.display = "block";

  } catch {
    alert("Login gagal");
  }
}

function updateUI() {
  document.getElementById("chukBalance").innerText = wallet.chuk;
  document.getElementById("piBalance").innerText = wallet.pi;
}

function earnChuk() {
  wallet.chuk += 1000;
  updateUI();
}

async function payWithPi() {
  if (typeof Pi === "undefined") {
    alert("Buka di Pi Browser!");
    return;
  }

  try {
    await Pi.createPayment({
      amount: 0.01,
      memo: "Buy CHUK"
    }, {

      onReadyForServerApproval: async (paymentId) => {
        await fetch(BASE_URL + "/approve", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ paymentId })
        });
      },

      onReadyForServerCompletion: async (paymentId, txid) => {
        await fetch(BASE_URL + "/complete", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ paymentId, txid })
        });

        wallet.chuk += 1000;
        updateUI();

        alert("Payment sukses!");
      }
    });

  } catch (e) {
    console.error(e);
  }
}
</script>

</body>
</html>
