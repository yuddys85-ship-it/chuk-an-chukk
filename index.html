<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chuk an Chukk</title>

  <!-- Pi SDK -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #0b0b0f;
      color: white;
      padding: 20px;
    }

    h1, h2 {
      text-align: center;
    }

    .card {
      background: #1c1c25;
      padding: 15px;
      border-radius: 10px;
      margin: 10px 0;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-green {
      background: #00c853;
      color: white;
    }

    .btn-purple {
      background: #6b2cff;
      color: white;
    }

    .center {
      text-align: center;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="center">
  <h1>Chuk an Chukk</h1>
  <p>Live Social App for Pi Community</p>
  <button class="btn-purple" onclick="login()">Login with Pi</button>
</div>

<!-- APP -->
<div id="appPage" style="display:none;">

  <h2 id="username"></h2>

  <div class="card">
    <h3>## Your Wallet</h3>

    <p><b>TEST MODE</b></p>

    <p>Unlocked Balance (Test)</p>
    <h2 id="chukBalance">0</h2>
    <p>TEST CHUK</p>

    <p>Locked Balance (Test)</p>
    <h2 id="lockedBalance">0</h2>

    <p>Test Pi Balance</p>
    <h2 id="piBalance">0</h2>

    <p>Total Balance</p>
    <h2 id="totalBalance">0</h2>
  </div>

  <div class="card">
    <button class="btn-purple" onclick="earnChuk()">🎁 Earn</button>
    <button class="btn-purple" onclick="unlockChuk()">🔓 Unlock</button>
    <button class="btn-purple" onclick="exchangeChuk()">🔄 Exchange</button>
  </div>

  <!-- 🔥 BUY SECTION -->
  <div class="card">
    <h3>Buy CHUK</h3>
    <button class="btn-green" onclick="payWithPi()">💸 Buy CHUK with Pi</button>
  </div>

</div>

<script>
  // INIT
  document.addEventListener("DOMContentLoaded", function () {
    if (typeof Pi !== "undefined") {
      Pi.init({ version: "2.0", sandbox: true });
    } else {
      alert("Buka di Pi Browser!");
    }
    loadWallet();
  });

  const BASE_URL = "https://chuk-an-chukk-beckend.vercel.app/api";

  let wallet = { chuk: 50000, locked: 25000, testPi: 10 };

  // LOGIN
  async function login() {
    try {
      const auth = await Pi.authenticate(["username"]);
      document.getElementById("username").innerText =
        "Welcome back!\n" + auth.user.username;

      showSection("app");
    } catch {
      alert("Login gagal");
    }
  }

  // WALLET
  function loadWallet() {
    const saved = localStorage.getItem("wallet");
    if (saved) wallet = JSON.parse(saved);
    updateUI();
  }

  function saveWallet() {
    localStorage.setItem("wallet", JSON.stringify(wallet));
  }

  function updateUI() {
    document.getElementById("chukBalance").innerText = wallet.chuk;
    document.getElementById("lockedBalance").innerText = wallet.locked;
    document.getElementById("piBalance").innerText = wallet.testPi;
    document.getElementById("totalBalance").innerText =
      wallet.chuk + wallet.locked;
  }

  function earnChuk() {
    wallet.chuk += 1000;
    saveWallet();
    updateUI();
    alert("+1000 Chuk");
  }

  function unlockChuk() {
    wallet.chuk += wallet.locked;
    wallet.locked = 0;
    saveWallet();
    updateUI();
    alert("Unlocked!");
  }

  function exchangeChuk() {
    let amt = parseInt(prompt("Jumlah Chuk:"));
    if (!amt || amt > wallet.chuk) return alert("Tidak valid");

    wallet.chuk -= amt;
    wallet.testPi += amt / 10000;

    saveWallet();
    updateUI();
    alert("Berhasil ditukar");
  }

  // 🔥 PAYMENT
  async function payWithPi() {
    try {
      await Pi.createPayment({
        amount: 0.01,
        memo: "Buy CHUK"
      }, {
        onReadyForServerApproval: async (paymentId) => {
          await fetch(BASE_URL + "/approve", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ paymentId })
          });
        },
        onReadyForServerCompletion: async (paymentId) => {
          await fetch(BASE_URL + "/complete", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ paymentId })
          });
          alert("💸 Pembayaran berhasil!");
        },
        onCancel: () => alert("Dibatalkan"),
        onError: () => alert("Error pembayaran")
      });
    } catch (e) {
      console.error(e);
    }
  }

  function showSection(id) {
    document.getElementById("loginPage").style.display = "none";
    document.getElementById("appPage").style.display = "none";
    document.getElementById(id + "Page").style.display = "block";
  }
</script>

</body>
</html>
