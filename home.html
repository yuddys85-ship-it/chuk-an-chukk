<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Home — Chuk an Chukk</title>

    <!-- MAIN CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <!-- =========================
         HEADER
    ========================== -->
    <header class="header">

        <div class="logo-title">
            CHUK AN CHUKK
        </div>

        <div class="header-icons">

            <button
                type="button"
                aria-label="Cari"
                class="header-button"
            >
                🔍
            </button>

            <button
                type="button"
                aria-label="Notifikasi"
                class="header-button"
            >
                🔔
            </button>

        </div>

    </header>


    <!-- =========================
         FEED
    ========================== -->
    <main class="feed" id="homeFeed">

        <!--
            POSTINGAN DARI SUPABASE
            AKAN DIMUAT OLEH home.js
        -->

        <!-- LOADING -->
        <div
            id="homeLoading"
            class="loading"
            style="display:none;"
        >
            Memuat postingan...
        </div>

        <!-- EMPTY -->
        <div
            id="homeEmpty"
            class="no-post"
            style="display:none;"
        >
            Belum ada postingan.
        </div>

    </main>


    <!-- =========================
         BOTTOM NAVIGATION
    ========================== -->
    <nav class="bottom-nav">

        <a
            href="home.html"
            class="bottom-nav-item active"
            aria-label="Home"
        >
            <span>🏠</span>
            <small>Home</small>
        </a>

        <a
            href="post.html"
            class="bottom-nav-item"
            aria-label="Post"
        >
            <span>➕</span>
            <small>Post</small>
        </a>

        <button
            type="button"
            class="bottom-nav-item"
            aria-label="Chat"
        >
            <span>💬</span>
            <small>Chat</small>
        </button>

        <a
            href="profile.html"
            class="bottom-nav-item"
            aria-label="Profile"
        >
            <span>👤</span>
            <small>Profile</small>
        </a>

    </nav>

</div>


<!-- =========================
     SUPABASE
========================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<!-- =========================
     HOME FEED
========================== -->

<script src="home.js"></script>

</body>
</html>
